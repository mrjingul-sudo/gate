name: VPN Gate Node Check

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get VPN Gate nodes + check via Cloudflare Worker + build page
        run: python vpngate.py
        env:
          # 已部署的检测 Worker (不要改动: 检测统一走这里)
          CHECK_WORKER: "https://check.230073.xyz/check?sstp=vpn:vpn@"
          CHECK_CONCURRENCY: "32"
          CHECK_TIMEOUT: "90"

      - name: Commit nodes.txt to repo
        run: |
          cp public/nodes.txt nodes.txt
          [ -f public/nodes.json ] && cp public/nodes.json nodes.json || true
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f nodes.txt nodes.json 2>/dev/null || git add -f nodes.txt
          git commit -m "update nodes $(date -u +%F_%H:%M)" || echo "no changes"
          git push
